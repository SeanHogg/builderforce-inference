# Releases the `bfi` inference engine and the `bf-context` local code-context service,
# for Windows, macOS (arm64 and Intel) and Linux. The Synapse desktop app is not built
# from this repo any more.
#
# Release-only on purpose: it runs on a `v*` tag or by hand, never on every push (a
# three-OS native build on every commit would cost more than it proves).
#
# Assets are named `bfi-<target><ext>` and `bf-context-<target><ext>`, plus
# `bf-teach-helper-<target><ext>` for Windows and macOS.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (vYYYY.M.D) — defaults to v<workspace version>'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bf-index -p bf-context --no-default-features
      - run: cargo test -p bfi-server -p bfi-runtime
      - run: cargo test -p bf-teach --lib

  tag:
    runs-on: ubuntu-22.04
    needs: test
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${version}"
          fi
          # The tag and the built version must agree.
          if [[ "${tag#v}" != "${version}" ]]; then
            echo "::error::tag ${tag} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The cli jobs upload into this release, so it must exist first.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.t.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # --latest=false: releases/latest links on builderforce.ai must keep resolving to the last release that has Synapse installers.
            gh release create "$tag" --latest=false --title "Builderforce inference ${{ steps.t.outputs.version }}" \
              --notes "The \`bfi\` inference engine and the \`bf-context\` local code-context service. Download the binaries for your platform below."
          fi

  cli:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build bfi and bf-context
        run: cargo build --release -p bfi -p bf-context --target ${{ matrix.target }}
      # The teach helper drives the desktop (UI Automation / Accessibility): no Linux asset.
      - name: Build bf-teach-helper
        if: runner.os != 'Linux'
        run: cargo build --release -p bf-teach --bin bf-teach-helper --target ${{ matrix.target }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bins="bfi bf-context"
          if [[ "${{ runner.os }}" != "Linux" ]]; then bins="$bins bf-teach-helper"; fi
          for bin in $bins; do
            src="target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}"
            dest="${bin}-${{ matrix.target }}${{ matrix.ext }}"
            cp "$src" "$dest"
            gh release upload "${{ needs.tag.outputs.tag }}" "$dest" --clobber
          done
