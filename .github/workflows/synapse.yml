# Builds the Synapse desktop installers from app/ (see app/README.md) and attaches them to
# the v<version> release. The release is created as a DRAFT and is only published (and marked
# latest) when every expected installer is attached, so releases/latest never points at a
# partial release (release.yml publishes the headless bfi / bf-context binaries with
# --latest=false).
#
# Run it by hand (workflow_dispatch) or push a tag: synapse-v2026.11.27.
#
# The Builderforce VSIX is supplied as a release URL. Spawn is built from pinned source unless
# an explicit URL is supplied. Tag-triggered runs use BUILDERFORCE_VSIX_URL and SPAWN_VSIX_URL.
name: Synapse desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2026.11.27 (the release is v<version>)'
        required: true
      builderforce_vsix_url:
        description: 'URL of the builderforce-ai .vsix (default: repository variable BUILDERFORCE_VSIX_URL)'
        required: false
      spawn_vsix_url:
        description: 'Optional Spawn VSIX URL (uses SPAWN_VSIX_URL or packages the pinned source)'
        required: false
      verify_only:
        description: 'Build and upload CI artifacts without creating or publishing a release'
        type: boolean
        default: false
      builderforce_vsix_ci_tag:
        description: 'Optional draft release in this repository carrying builderforce.vsix for a verification build'
        type: string
  push:
    tags: ['synapse-v*']

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || '' }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION:-${GITHUB_REF_NAME#synapse-v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      # The build jobs upload into this release, so it must exist first. It is a draft until the
      # publish job has checked that every installer is attached.
      - name: Create the draft release if missing
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ steps.v.outputs.tag }}"
          title="Synapse ${{ steps.v.outputs.version }}"
          if existing=$(gh release view "$tag" --json isDraft,name 2>/dev/null); then
            if ! jq -e --arg title "$title" '.isDraft and .name == $title' <<< "$existing" >/dev/null; then
              echo "::error::$tag already belongs to a different or published release"
              exit 1
            fi
          else
            gh release create "$tag" --draft --latest=false --target "${{ github.sha }}" \
              --title "$title" \
              --notes "Synapse desktop installers for Windows, macOS and Linux."
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Code-OSS 1.140's native dependency installer recognizes Visual Studio 2022.
          - { os: windows-2022, platform: win32, arch: x64 }
          - { os: macos-latest, platform: darwin, arch: arm64 }
          # Native Intel runner. If this label is ever unavailable, cross-build x64 on
          # macos-latest instead (os: macos-latest, plus npm_config_arch=x64 in the job env).
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Clone upstream first (the runner's preinstalled Node runs this), so the next step can
      # read upstream's own .nvmrc.
      - name: Fetch upstream
        shell: bash
        run: >
          node app/scripts/build.mjs --stage fetch
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --version ${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.build/vscode/.nvmrc
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot dpkg rpm
      - name: Fetch the extension packages
        shell: bash
        env:
          BF_URL: ${{ inputs.builderforce_vsix_url || vars.BUILDERFORCE_VSIX_URL }}
          SPAWN_URL: ${{ inputs.spawn_vsix_url || vars.SPAWN_VSIX_URL }}
          VERIFY_ONLY: ${{ inputs.verify_only || false }}
          BF_CI_TAG: ${{ inputs.builderforce_vsix_ci_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_ONLY" != true && -z "$BF_URL" ]]; then
            echo "::error::set builderforce_vsix_url or the BUILDERFORCE_VSIX_URL repository variable"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vsix"
          if [[ "$VERIFY_ONLY" == true && -n "$BF_CI_TAG" ]]; then
            gh release download "$BF_CI_TAG" --pattern builderforce.vsix --dir "$RUNNER_TEMP/vsix"
          elif [[ -n "$BF_URL" ]]; then
            curl -fsSL "$BF_URL" -o "$RUNNER_TEMP/vsix/builderforce.vsix"
          else
            echo "::error::provide builderforce_vsix_url or builderforce_vsix_ci_tag"
            exit 1
          fi
          if [[ -n "$SPAWN_URL" ]]; then
            curl -fsSL "$SPAWN_URL" -o "$RUNNER_TEMP/vsix/spawn.vsix"
          else
            spawn="$RUNNER_TEMP/spawn"
            git clone --filter=blob:none https://github.com/SeanHogg/builderforce-spawn.git "$spawn"
            git -C "$spawn" checkout 1f6a10b6832ecf0d3a6585a489ecdec34d3f9073
            npm --prefix "$spawn/extension" ci --no-audit --no-fund
            npm --prefix "$spawn/extension" run package -- --out "$RUNNER_TEMP/vsix/spawn.vsix"
          fi

      # Signing setup. The composite actions were written for Tauri: macOS exports the Apple
      # variables only when the certificate imports; Windows writes a signCommand or certificate
      # thumbprint into a config JSON, which app/scripts/sign-windows.ps1 applies.
      - name: macOS signing variables
        if: matrix.platform == 'darwin'
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          import-for-codesign: 'true'
      - name: Windows signing configuration
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          '{"productName":"Synapse","bundle":{}}' | Set-Content "$env:RUNNER_TEMP/sign.json"
      - name: Put the Windows SDK on PATH
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          . ./app/scripts/windows-sdk.ps1
          Split-Path -Parent (Get-WindowsSignTool) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Windows signing setup
        if: matrix.platform == 'win32'
        uses: ./.github/actions/windows-signing
        with:
          config: ${{ runner.temp }}/sign.json
          azure-endpoint: ${{ secrets.AZURE_CODESIGN_ENDPOINT }}
          azure-account: ${{ secrets.AZURE_CODESIGN_ACCOUNT }}
          azure-profile: ${{ secrets.AZURE_CODESIGN_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          certificate-password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Stage 1: the packaged app, with the built-in extensions inside it (on Windows this includes
      # inno_updater.exe, so the signing step below covers it).
      - name: Package Synapse
        shell: bash
        env:
          # @vscode/ripgrep's npm installer reads this when fetching the pinned GitHub release.
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node app/scripts/build.mjs --stage package
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --version ${{ needs.version.outputs.version }}
          --builderforce-vsix "$RUNNER_TEMP/vsix/builderforce.vsix"
          --spawn-vsix "$RUNNER_TEMP/vsix/spawn.vsix"

      # Sign the packaged app BEFORE the installer is made from it.
      - name: Sign the macOS app
        if: matrix.platform == 'darwin' && env.APPLE_CERTIFICATE != '' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          app="app/.build/VSCode-darwin-${{ matrix.arch }}/Synapse.app"
          node app/scripts/sign-macos.mjs --app "$app" --identity "$APPLE_SIGNING_IDENTITY" \
            --entitlements app/build/darwin/entitlements.plist
      - name: Sign the Windows binaries
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./app/scripts/sign-windows.ps1 -Config "$env:RUNNER_TEMP/sign.json" -Path app/.build/VSCode-win32-x64 -Recurse -Include '*.exe','*.dll'

      # Stage 2: the installer (.dmg / Inno setup / .deb).
      - name: Build the installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          node app/scripts/build.mjs --stage installer
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --version ${{ needs.version.outputs.version }}

      # Sign the installer itself. macOS: sign the dmg, notarize it, staple the ticket.
      - name: Sign, notarize and staple the macOS image
        if: matrix.platform == 'darwin' && env.APPLE_CERTIFICATE != '' && env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          set -euo pipefail
          for dmg in app/.build/out/*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            if [[ -n "${APPLE_ID:-}" ]]; then
              xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              xcrun stapler staple "$dmg"
            else
              echo "::notice::No APPLE_ID; the .dmg is signed but not notarized."
            fi
          done
      - name: Sign the Windows installer
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./app/scripts/sign-windows.ps1 -Config "$env:RUNNER_TEMP/sign.json" -Path app/.build/out -Include '*.exe'

      - name: Upload to the release
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for f in app/.build/out/*; do
            gh release upload "${{ needs.version.outputs.tag }}" "$f" --clobber
          done
      - name: Upload verification installer
        if: ${{ inputs.verify_only }}
        uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ matrix.platform }}-${{ matrix.arch }}
          path: app/.build/out/*
          if-no-files-found: error

  # Runs even when a build leg failed, so the failure is reported here with a clear message and
  # the release stays a draft.
  publish:
    needs: [version, build]
    if: ${{ always() && !inputs.verify_only && needs.version.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse a partial release
        if: needs.build.result != 'success'
        shell: bash
        run: |
          echo "::error::A build leg did not succeed (build: ${{ needs.build.result }}); ${{ needs.version.outputs.tag }} stays a draft and is not published."
          exit 1
      - uses: actions/checkout@v4
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          required=b549e456397c965b2550f4bc6d9247b199358557
          live=$(curl -fsS --max-time 20 https://api.builderforce.ai/health | jq -er .commit)
          if [[ ! "$live" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::The production API did not report a valid commit."
            exit 1
          fi
          status=$(gh api "repos/SeanHogg/Builderforce.ai/compare/${required}...${live}" --jq .status)
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::The production API must include the Spawn and runtime ID migration before Synapse ships."
            exit 1
          fi
          tag="${{ needs.version.outputs.tag }}"
          gh release view "$tag" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          node app/scripts/check-assets.mjs "${{ needs.version.outputs.version }}" "$RUNNER_TEMP/assets.txt"
          gh release edit "$tag" --draft=false --latest
