# Releases the `bfi` inference engine and the `bf-context` local code-context service,
# for Windows, macOS (arm64 and Intel) and Linux. Synapse uses its own workflow.
#
# Release-only on purpose: it runs on a `v*` tag or by hand, never on every push (a
# three-OS native build on every commit would cost more than it proves).
#
# Assets are named `bfi-<target><ext>` and `bf-context-<target><ext>`, plus
# `bf-teach-helper-<target><ext>` for Windows and macOS.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (vYYYY.M.D) — defaults to v<workspace version>'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bf-index -p bf-context --no-default-features
      - run: cargo test -p bfi-server -p bfi-runtime
      - name: Install Teach test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev
      - run: cargo test -p bf-teach --lib

  tag:
    runs-on: ubuntu-22.04
    needs: test
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)"/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="v${version}"
          fi
          # The tag and the built version must agree.
          if [[ "$tag" != "v${version}" ]]; then
            echo "::error::tag ${tag} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.t.outputs.tag }}"
          title="Builderforce inference ${{ steps.t.outputs.version }}"
          if existing=$(gh release view "$tag" --json isDraft,name 2>/dev/null); then
            if ! jq -e --arg title "$title" '.isDraft and .name == $title' <<< "$existing" >/dev/null; then
              echo "::error::$tag already belongs to a different or published release"
              exit 1
            fi
          else
            # --latest=false: releases/latest links on builderforce.ai must keep resolving to the last release that has Synapse installers.
            gh release create "$tag" --draft --target "$GITHUB_SHA" --latest=false --title "$title" \
              --notes "The bfi inference engine, bf-context local code-context service, and Teach-once helpers for Windows and macOS."
          fi

  cli:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build bfi and bf-context
        run: cargo build --release -p bfi -p bf-context --target ${{ matrix.target }}
      # The teach helper drives the desktop (UI Automation / Accessibility): no Linux asset.
      - name: Build bf-teach-helper
        if: runner.os != 'Linux'
        run: cargo build --release -p bf-teach --bin bf-teach-helper --target ${{ matrix.target }}
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          import-for-codesign: 'true'
      - name: Sign and verify the macOS Teach helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?Configure the Apple Developer ID signing certificate and identity}"
          helper="target/${{ matrix.target }}/release/bf-teach-helper"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$helper"
          codesign --verify --strict "$helper"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bins="bfi bf-context"
          if [[ "${{ runner.os }}" != "Linux" ]]; then bins="$bins bf-teach-helper"; fi
          for bin in $bins; do
            src="target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}"
            dest="${bin}-${{ matrix.target }}${{ matrix.ext }}"
            cp "$src" "$dest"
            gh release upload "${{ needs.tag.outputs.tag }}" "$dest" --clobber
          done

  publish:
    needs: [tag, cli]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the completed headless release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.tag.outputs.tag }}" --draft=false --latest=false
