[package]
name = "bfi-runtime"
description = "Tokenizer, sampler, scheduler, model store for bfi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bfi-gguf = { path = "../bfi-gguf" }
bfi-core = { path = "../bfi-core" }
bfi-models = { path = "../bfi-models" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `json` = the `tojson` filter HF chat templates use for tools.
minijinja = { workspace = true, features = ["json"] }
fancy-regex.workspace = true
parking_lot.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs.workspace = true
