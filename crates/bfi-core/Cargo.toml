[package]
name = "bfi-core"
description = "Tensor + Backend trait; CPU reference kernels for bfi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Internal: any CubeCL runtime. Compiles the shared `#[cube]` kernels (src/kernels).
cube = [
    "dep:cubecl",
    "cubecl/std",
    "dep:getrandom",
    "dep:cubecl-common",
    "dep:serde_json",
]
# CubeCL 0.10 feature names: cuda, rocm→hip, metal→wgpu-msl, vulkan→wgpu-spirv.
cuda = ["cube", "cubecl/cuda"]
rocm = ["cube", "cubecl/rocm"]
metal = ["cube", "cubecl/metal"]
vulkan = ["cube", "cubecl/vulkan"]
# wgpu + WGSL. On wasm32 this is the browser's WebGPU; natively it is wgpu on
# Vulkan/Metal/DX12 (how the resident kernels are tested without a browser).
# Enables `bfi_core::resident` (GPU-resident tensors, async readback).
# `wgpu` (same 29.x CubeCL uses) is only for KV allocation probes in an
# out-of-memory error scope, which CubeCL does not expose.
webgpu = ["cube", "cubecl/webgpu", "dep:wgpu"]

[dependencies]
bfi-gguf = { path = "../bfi-gguf" }
anyhow.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
cubecl = { workspace = true, optional = true }
wgpu = { version = "29", optional = true, default-features = false }

# Threads: rayon natively, and on wasm32 only in the THREADED browser build (atomics +
# shared memory, `crates/bfi-web/build-threads.mjs`, workers from wasm-bindgen-rayon).
# The default wasm32 build has no threads; `src/par.rs` runs the same kernels sequentially.
[target.'cfg(any(not(target_arch = "wasm32"), target_feature = "atomics"))'.dependencies]
rayon.workspace = true

# cubecl-common → rand 0.10 → getrandom 0.4, which refuses wasm32-unknown-unknown
# unless a JS backend is chosen. getrandom 0.4 needs only the `wasm_js` feature
# (no `getrandom_backend` cfg / rustflags). Acceptable per its README because
# CubeCL's wgpu runtime already depends on wasm-bindgen on this target.
#
# cubecl-runtime 0.10 only enables the cubecl-common features it needs
# (`serde`, `hash`) and serde_json's `std` under a target_os = windows/linux/
# macos/android dependency block, yet uses `cubecl_common::{bytes, hash}` and
# serde_json unconditionally. On wasm32 nothing turns them on, so the build
# fails; these two lines restore the native feature set via unification.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
cubecl-common = { version = "=0.10.0", default-features = false, features = ["std", "serde", "hash"], optional = true }
serde_json = { workspace = true, optional = true }

# The SIMD128-vs-scalar proof runs under `wasm-pack test --node crates/bfi-core`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
