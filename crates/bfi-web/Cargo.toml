[package]
name = "bfi-web"
description = "bfi in the browser: 1-bit Bonsai (GGUF Q1_0) on WebGPU or the CPU, exposed as the BfiEngine JS class"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
# The WebGPU backend (CubeCL / wgpu). The default artifact carries it and the CPU
# backend; the THREADED artifact is CPU-only (wgpu's wasm types are not Send/Sync
# once atomics are on).
webgpu = ["bfi-engine/webgpu", "bfi-core/webgpu", "bfi-models/webgpu"]
# The THREADED CPU artifact: rayon over wasm-bindgen-rayon's Web Worker pool. Needs the
# pinned nightly + `-Z build-std` + atomics — build it with `node build-threads.mjs`.
threads = ["dep:wasm-bindgen-rayon", "dep:rayon"]

# Every dependency is wasm32-only. Natively this crate is empty, so building the
# workspace never unifies bfi-core's `webgpu` feature into the native `bfi`
# binary (features on a target-specific dependency are not activated for other
# targets; cuda / rocm / metal / vulkan builds stay exactly as they were).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The engine itself (state machine, load, chat, plan) — this crate is its wasm-bindgen
# face, as `bfi-node` is its napi one.
bfi-engine = { path = "../bfi-engine" }
bfi-gguf = { path = "../bfi-gguf" }
bfi-core = { path = "../bfi-core" }
bfi-models = { path = "../bfi-models" }
# `no-bundler`: the threaded artifact is served as plain files (hosts copy it, never
# bundle it), so the pool's helper worker finds the glue by URL, not `../../..`.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
rayon = { workspace = true, optional = true }
serde_json.workspace = true
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"

[package.metadata.wasm-pack.profile.release]
# wasm-opt runs separately in CI if wanted; keep the build reproducible offline.
wasm-opt = false
