[workspace]
resolver = "2"
members = [
    "crates/bf-index",
    "crates/bf-context",
    "crates/bf-memory",
    "crates/bf-mcp",
    "crates/bf-local",
    "crates/bf-teach",
    "crates/bf-vault",
    "crates/bf-cloud",
    "crates/bfi-gguf",
    "crates/bfi-core",
    "crates/bfi-models",
    "crates/bfi-runtime",
    "crates/bfi-server",
    "crates/bfi",
    "crates/bfi-web",
    "app/src-tauri",
]

[workspace.package]
version = "2026.10.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/SeanHogg/builderforce-inference"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
notify = "6.1"
notify-debouncer-mini = "0.4"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
fastembed = "4"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
dirs = "5"
rand = "0.8"
tempfile = "3"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
memmap2 = "0.9"
half = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "time", "signal", "process"] }
tower-http = { version = "0.6", features = ["cors"] }
minijinja = "2"
fancy-regex = "0.14"
rayon = "1"
inventory = "0.3"
hex = "0.4"
sha2 = "0.10"
parking_lot = "0.12"
# Pinned: 0.10.0 released 2026-05-07 (crates.io). Must stay ≥2 weeks old per PRD M1.
cubecl = { version = "=0.10.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
