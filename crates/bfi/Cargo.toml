[package]
name = "bfi"
description = "Builderforce native inference CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bfi"
path = "src/main.rs"

[features]
default = []
cuda = ["bfi-core/cuda"]
rocm = ["bfi-core/rocm"]
metal = ["bfi-core/metal"]
vulkan = ["bfi-core/vulkan"]

[dependencies]
bfi-server = { path = "../bfi-server" }
bfi-runtime = { path = "../bfi-runtime" }
bfi-gguf = { path = "../bfi-gguf" }
bfi-core = { path = "../bfi-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ureq.workspace = true
sysinfo.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
